# Pinned versions for the bridge.
#
# Upgraded 2026-08-19: Spring Boot 3.3.2 -> 4.1.0, HAPI FHIR 7.2.0 -> 8.10.1, Kotlin 1.9.24 ->
# 2.4.10. Rationale and the version-pairing constraints are in build.gradle.kts.
#
# Verified: `gradle build` is green on this set (Gradle 8.14.5 / JDK 21) — dependencies resolve,
# protoc codegen runs, compile and tests pass, bootJar packages. The one residual risk is HAPI 8.x
# on Spring Framework 7 at RUNTIME (HAPI CI-tests against Spring Framework 6.2.18); see the header
# of build.gradle.kts.
kotlinVersion=2.4.10
springBootVersion=4.1.0
hapiVersion=8.10.1

# grpc-java 1.83.x is the first release built against the Netty 4.2 line (1.82.x and earlier were
# Netty 4.1). Spring Boot 4.1.0's BOM ships Netty 4.2.15.Final but pins grpc-bom to 1.80.0, which
# is a Netty-4.1 build — that pairing would break the epoll UDS transport. Moving grpc UP to
# 1.83.1 lands exactly on Boot's Netty 4.2.15.Final rather than dragging Netty back down.
grpcVersion=1.83.1
nettyVersion=4.2.15.Final

# Boot 4.1.0 manages protobuf-bom 4.34.2; 4.35.1 is current. protoc is pinned to the same number
# by the protobuf gradle plugin block in build.gradle.kts.
protobufVersion=4.35.1
# Held at the 0.9.x line deliberately: 0.10.0 is available but its DSL compatibility with the
# `sourceSets { main { proto { srcDir(...) } } }` form used here is unverified, and Spring Boot
# 4.1's own docs still reference 0.9.6.
protobufPluginVersion=0.9.6

org.gradle.jvmargs=-Xmx2g

# Build-footprint controls for the testbed builder (a memory-constrained, zero-swap podman VM).
# The bridge RUNTIME is lightweight; the BUILD is what spikes memory, because the Kotlin plugin
# otherwise forks its own compiler daemon (a second JVM) on top of the -Xmx2g Gradle JVM. Running
# the Kotlin compiler in-process keeps compilation under the single Gradle heap ceiling, and
# capping workers at 1 stops parallel tasks from multiplying peak memory. Net effect: peak build
# memory collapses toward ~2 GiB instead of the ~3.5-4 GiB that was crashing the VM at bootJar.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
